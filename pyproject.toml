[project]
name = "clinical-evidence-retrieval"
version = "0.1.0"
description = "Hybrid BM25 + dense retrieval with reciprocal rank fusion and cross-encoder re-ranking for medical evidence search (BEIR NFCorpus), with paired-bootstrap evaluation, latency profiling and a FastAPI endpoint."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Reagan Kesseku" }]
license = { text = "MIT" }
keywords = ["information-retrieval", "rag", "bm25", "dense-retrieval", "reranking", "beir", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24",
    "fastapi>=0.110",
    "pydantic>=2.5",
    "httpx>=0.27",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
models = ["torch>=2.1", "sentence-transformers>=3.0"]
serve = ["uvicorn>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
evidence-ir = "evidence_ir.cli:main"

[project.urls]
Homepage = "https://github.com/rkesseku/clinical-evidence-retrieval"
Repository = "https://github.com/rkesseku/clinical-evidence-retrieval"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evidence_ir*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
